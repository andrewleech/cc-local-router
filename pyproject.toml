[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-local-router"
version = "0.1.0"
description = "Model-alias and availability-gate patches for cc-patcher, backing a local-inference model-splitter proxy in front of Claude Code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cc-patcher"]

[project.entry-points."cc_patcher.patches"]
model-alias = "cc_local_router:PATCHES"

[project.scripts]
claude-v2 = "cc_local_router.launcher:claude_v2"
claude-channels-v2 = "cc_local_router.launcher:claude_channels_v2"
cc-local-router-proxy = "cc_local_router.proxy_control:main"

[tool.hatch.build.targets.wheel]
# proxy/index.ts ships as package data and is run in place by Bun, so
# installing the package is all it takes to have a runnable proxy.
# Its tests are the one thing not worth shipping.
packages = ["cc_local_router"]
exclude = ["*.test.ts"]
